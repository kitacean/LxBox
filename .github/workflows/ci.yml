# LxBox — CI/CD
#
# Ветки:
#   - develop — основная ветка разработки (все feature/fix PR'ы)
#   - main    — только релизные коммиты (merge из develop + тег vX.Y.Z)
# См. docs/RELEASE_PROCESS.md для полного протокола.
#
# 1) Tag push (v*):            checks → build → GitHub Release + Google Play (§436) → publish-manifest
# 2) push develop / main:      checks only
# 3) PR → develop / main:      checks only
# 4) workflow_dispatch:        checks | build | release (ручной)

name: CI

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_mode:
        description: "checks | build | build-fast (one APK, see abi; no checks/AAB) | release"
        required: true
        default: "checks"
        type: choice
        options: [checks, build, build-fast, release]
      abi:
        description: "build-fast only: which APK to build"
        required: false
        default: "arm64-v8a"
        type: choice
        options: [arm64-v8a, armeabi-v7a, x86_64, universal]
      test_path:
        description: "Pinpoint run: test path(s) relative to app/ (e.g. test/screens/startup_wizard_test.dart). Empty = full suite. Skips analyze for speed."
        required: false
        default: ""
        type: string
      test_name:
        description: "Filter by test/group name (--name, substring). Runs only matching — handy to start with a specific group inside a file. Works only together with test_path."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # build-fast — своя группа: сборку можно запускать прямо на develop, она не
  # отменяет push-проверки той же ветки и не отменяется ими.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event.inputs.run_mode == 'build-fast' && '-fast' || '' }}
  cancel-in-progress: true

jobs:
  meta:
    name: Meta
    if: startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode != 'checks')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_release: ${{ steps.meta.outputs.is_release }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.run_mode }}" == "release" ]]; then
            if ! VERSION="$(git describe --tags --exact-match 2>/dev/null)"; then
              echo "::error::run_mode=release, но HEAD не на теге. Пуш тега vX.Y.Z или запусти на теге." >&2
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
            if [ -n "$TAG" ]; then
              SINCE="$(git rev-list "${TAG}..HEAD" --count)"
              VERSION="${TAG#v}-dev.${SINCE}"
            else
              SHORT_SHA="$(git rev-parse --short=7 HEAD)"
              VERSION="dev-${SHORT_SHA}"
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$VERSION" == *-rc.* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    if: github.event.inputs.run_mode != 'build-fast'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Flutter version pin
        id: flutter_pin
        run: echo "version=$(tr -d '[:space:]' < android/flutter.version)" >> "$GITHUB_OUTPUT"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        if: ${{ github.event.inputs.test_path == '' }}
        run: flutter analyze

      - name: Pubspec version is a placeholder (develop only)
        if: ${{ github.ref == 'refs/heads/develop' || github.base_ref == 'develop' }}
        run: |
          VERSION="$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//')"
          echo "pubspec version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "::error file=app/pubspec.yaml::Не удалось прочитать version: из pubspec.yaml — проверьте путь и working-directory шага."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -qE '(-dev\.[0-9]+|^0\.0\.0(\+|$))'; then
            echo "::error file=app/pubspec.yaml::В develop попала реальная версия '$VERSION'. Ожидается placeholder с суффиксом -dev.N (RELEASE_PROCESS.md §2.6, §379). Лечение: git checkout HEAD -- app/pubspec.yaml до коммита merge-back'а."
            exit 1
          fi

      - name: L10n checks
        if: ${{ github.event.inputs.test_path == '' }}
        working-directory: app
        run: |
          dart run tool/l10n/template_check.dart --strict
          dart run tool/l10n/ui_check.dart --strict
          dart run tool/l10n/hardcoded_check.dart --strict
          dart run tool/l10n/kotlin_check.dart --strict

      - name: Docs parity
        if: ${{ github.event.inputs.test_path == '' }}
        working-directory: app
        run: dart run tool/docs/parity_check.dart --strict

      - name: Fastlane changelogs ≤ 500 chars
        if: ${{ github.event.inputs.test_path == '' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0
          for F in fastlane/metadata/android/*/changelogs/*.txt; do
            N=$(python3 -c 'import sys; print(len(open(sys.argv[1], encoding="utf-8").read().rstrip("\n")))' "$F")
            if [ "$N" -gt 500 ]; then
              echo "::error file=$F::$N символов, лимит описания выпуска в Google Play — 500."
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 0 ]; then
            echo "OK: все changelogs ≤ 500 символов."
          fi
          exit "$FAIL"

      - name: Contract lock
        if: ${{ github.event.inputs.test_path == '' }}
        working-directory: app
        run: dart run tool/check_contract_lock.dart

      - name: Test
        run: |
          TEST_PATH="${{ github.event.inputs.test_path }}"
          TEST_NAME="${{ github.event.inputs.test_name }}"
          if [ -n "$TEST_PATH" ]; then
            ARGS=(test -r expanded "$TEST_PATH")
            if [ -n "$TEST_NAME" ]; then
              ARGS+=(--name "$TEST_NAME")
              echo "::notice::Name filter: $TEST_NAME"
            fi
            echo "::notice::Pinpoint test run: $TEST_PATH"
            flutter "${ARGS[@]}"
          else
            dart run tool/gen_test_bundles.dart
            flutter test test_bundle $(cat test_bundle/excluded.txt)
          fi

  public-subs:
    name: PublicSubsCorpus
    if: ${{ github.event.inputs.test_path == '' && github.event.inputs.run_mode != 'build-fast' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Flutter version pin
        id: flutter_pin
        run: echo "version=$(tr -d '[:space:]' < android/flutter.version)" >> "$GITHUB_OUTPUT"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Corpus run (parse only, no core, no network)
        env:
          LX_CORPUS_PUBLIC: "1"
          LX_CORPUS_REPORT: "1"
        run: flutter test test/public_subscriptions

      - name: Upload corpus reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-subs-corpus-report
          path: |
            app/test/fixtures/public_subscriptions/report.json
            app/test/fixtures/public_subscriptions/report.md
          retention-days: 14

  android:
    if: >-
      !cancelled() && needs.meta.result == 'success' &&
      (needs.checks.result == 'success' ||
       (needs.checks.result == 'skipped' && github.event.inputs.run_mode == 'build-fast')) &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode != 'checks'))
    needs: [meta, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK Platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null

      - name: Fetch sing-box-lx core (libbox.aar)
        working-directory: .
        run: ./scripts/fetch-libbox.sh

      - name: Flutter version pin
        id: flutter_pin
        run: echo "version=$(tr -d '[:space:]' < android/flutter.version)" >> "$GITHUB_OUTPUT"

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_pin.outputs.version }}
          cache: true

      - name: Inject release version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="0.0.0-${VERSION}"
            CODE_VERSION="0.0.0"
          else
            CODE_VERSION="$VERSION"
          fi
          BUILD_NUMBER=$(../scripts/version-code.sh "$CODE_VERSION" universal)
          sed -i.bak -E "s/^version: .*/version: $VERSION+$BUILD_NUMBER/" pubspec.yaml
          rm -f pubspec.yaml.bak
          echo "Injected: $VERSION+$BUILD_NUMBER (base, ABI=0)"
          {
            echo "VERSION_NAME=$VERSION"
            echo "CODE_VERSION=$CODE_VERSION"
          } >> "$GITHUB_ENV"

      - name: Dependencies
        run: flutter pub get

      - name: Android release keystore (optional)
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret; release APK will use debug signing."
            exit 0
          fi
          : "${ANDROID_KEYSTORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD when BASE64 is set}"
          : "${ANDROID_KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD when BASE64 is set}"
          : "${ANDROID_KEY_ALIAS:?Set ANDROID_KEY_ALIAS when BASE64 is set}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build APKs (one run per target)
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/app/outputs/flutter-apk
          build_one() {
            local VARIANT="$1" PLATFORM="$2" ABI_FILTER="$3"
            local CODE
            CODE=$(../scripts/version-code.sh "$CODE_VERSION" "$VARIANT")
            echo "::group::Build $VARIANT (versionCode=$CODE)"
            if [ -n "$ABI_FILTER" ]; then
              LXBOX_ABI_FILTER="$ABI_FILTER" \
                flutter build apk --release \
                  --target-platform "$PLATFORM" \
                  --build-name "$VERSION_NAME" --build-number "$CODE"
            else
              flutter build apk --release \
                --build-name "$VERSION_NAME" --build-number "$CODE"
            fi
            mv "$OUT/app-release.apk" "$OUT/app-${VARIANT}-release.apk"
            echo "::endgroup::"
          }
          if [ "${{ github.event.inputs.run_mode }}" = "build-fast" ]; then
            case "${{ github.event.inputs.abi }}" in
              universal)   build_one universal   "android-arm,android-arm64,android-x64" "" ;;
              armeabi-v7a) build_one armeabi-v7a android-arm                             armeabi-v7a ;;
              x86_64)      build_one x86_64      android-x64                             x86_64 ;;
              *)           build_one arm64-v8a   android-arm64                           arm64-v8a ;;
            esac
          else
            build_one universal   "android-arm,android-arm64,android-x64" ""
            build_one armeabi-v7a android-arm                             armeabi-v7a
            build_one arm64-v8a   android-arm64                           arm64-v8a
            build_one x86_64      android-x64                             x86_64
          fi
          ls -la "$OUT"/app-*-release.apk

      - name: Send APK to private Telegram channel
        if: success() && (github.event.inputs.run_mode == 'build-fast' || github.event.inputs.run_mode == 'build')
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          APP_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          FOUND=0
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -e "$f" ] || continue
            FOUND=1
            VARIANT=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            OUT="/tmp/LxBox-${APP_VERSION}-${VARIANT}.apk"
            cp "$f" "$OUT"
            curl -sf -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TG_CHAT_ID}" \
              -F "document=@${OUT}" \
              -F "caption=L×Box v${APP_VERSION} (${VARIANT})" > /dev/null
            rm -f "$OUT"
          done
          [ "$FOUND" -eq 1 ]

      - name: Publish APK to GitHub Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag || format('build-{0}', github.run_number) }}
          name: L×Box ${{ needs.meta.outputs.version }} (build #${{ github.run_number }})
          files: app/build/app/outputs/flutter-apk/app-*-release.apk
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
          make_latest: true

name: Sync Upstream

on:
  schedule:
    # Runs daily at 04:00 UTC (07:00 MSK)
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Sync with Leadaxe/LxBox
        id: sync
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/Leadaxe/LxBox.git
          git fetch upstream "$BRANCH"

          BEHIND=$(git rev-list --count "HEAD..upstream/$BRANCH")
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge "upstream/$BRANCH" --no-edit; then
            # Автоматически оставляем свой README.md при конфликте
            if git diff --name-only --diff-filter=U | grep -qx "README.md"; then
              git checkout --ours README.md
              git add README.md
            fi

            # Если остались конфликты в других файлах — безопасно отменяем
            REMAINING=$(git diff --name-only --diff-filter=U)
            if [ -n "$REMAINING" ]; then
              git merge --abort || true
              echo "::error::Merge conflict with upstream in: $REMAINING"
              exit 1
            fi

            git commit --no-edit
          fi

          git push origin "$BRANCH"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Trigger APK build if updated
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: |
          gh workflow run ci.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f run_mode=build-fast \
            -f abi=arm64-v8a
